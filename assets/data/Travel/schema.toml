set = "Travel"
key = "int"              # the game's TaxiPath ID of a flight, a boat or a zeppelin; our own number for a way the game has no path for
                         # (the tram 1000369; a lift's car from 1100001 on, kept for a car at the same place; a portal 1200000 + its
                         # area trigger's ID: dev/tools/travel-data; a portal object 2000000 + its game object's entry: batch 13; a
                         # teleport 3000000 + its spell's ID: dev/tools/travel-data)
learn = true             # learnt in play: where each teleport brought one (Core's watcher, Data/Teleports.lua); the flight
                         # master's flights and their costs to come
about = "The ways to travel other than on foot: boats, zeppelins, trams, lifts, portals, teleports and flights, with their times."

[fields]
kind     = { type = "enum", values = ["boat", "zeppelin", "tram", "lift", "portal", "flight", "teleport"] }
name     = { type = "text" }
from     = { type = "point" }
to       = { type = "point" }
fromNode = { type = "int", min = 0 }         # a flight's taxi nodes (the flight points themselves are the game's)
toNode   = { type = "int", min = 0 }
side     = { type = "enum", values = ["alliance", "horde"] }  # none: both. A flight's: only that side's flight masters stand at both
                                             # ends; a boat's, zeppelin's or the tram's: its docks lie near that side's flight
                                             # masters alone (its towns, dev/tools/travel-data's DOCKSIDE yards); a portal's:
                                             # its town's (the NPCs that side's there); a teleport's: the races that have it
time     = { type = "number", min = 0 }      # the trip, in seconds (a lift's: its slower ride, up or down)
wait     = { type = "number", min = 0 }      # between two departures, in seconds (a transport: from one dock, its way once round;
                                             # the tram: from one station, its trains' round over the trains; a lift's car:
                                             # from one end, its motion once round)
cost     = { type = "money" }
length   = { type = "number", min = 0 }      # yards along its way, from the game's path (a transport's once round, its leaps not
                                             # counted; a lift's: the yards it rises; a portal's: between its two ends)
# path: the way's points in the world's yards (x to the north, y to the west), as the game's path has them (points
# on a straight run left out), for the map to draw it. A flight's lie on the continent of its start. A boat's or a
# zeppelin's is one way round as the game moves it, after its last point again from its first: map is the world's
# map a point lies on (at its first point and wherever the way comes onto another), stay the seconds it stands
# there at a dock, jump that it leaps to the point from the one before (onto another map, or far on the same). A
# tram's is its two stations in its own map's yards (where one leaves it; its trains run between them). A lift's is
# its car's two ends, the lower first with its map, each with z, its height: where the car stands at the start of its
# motion, moved by the game's TransportAnimation to its lowest and its highest (from and to: the two on the zone maps).
# A portal's is the game's area trigger one steps into (or the portal object one uses), with its map, then where it
# brings one, each with z (from and to: the two on the zone maps). A teleport's is where it brings one, with its map
# (and z where known): none while that is not known.
path     = { type = "list", of = "tuple", parts = [
    { name = "x", type = "number" },
    { name = "y", type = "number" },
    { name = "map", type = "int", min = 0 },
    { name = "stay", type = "number", min = 0 },
    { name = "jump", type = "bool" },
    { name = "z", type = "number" },
] }
# A boat's or zeppelin's docks on the zone maps, for the map's pins: one per place it stops at (stops within 20 yards
# are one), in the order it first comes to them, placed from its path as every map point is (map-data's Placer); a
# tram's the cities' entrances to its stations, in its path's order; and
# the game's area each lies in (its AreaTable ID, as the terrain or a building there gives it; 0: none), which names it.
docks     = { type = "list", of = "point" }
dockAreas = { type = "list", of = "int", min = 0 }
# A teleport: the spell that brings one there (the one the game names when it is cast; an item's, the spell it casts),
# the items that cast it (none: a spell one knows) and the item its cast uses up (a reagent).
spell     = { type = "int", min = 1 }
items     = { type = "list", of = "ref", set = "Items" }
reagent   = { type = "ref", set = "Items" }
# A portal only one class may take: the game's class ID (the set Classes). The portal objects one uses, the mages'
# own (8; Saneroki, 2026-11-10: only mages can use them), not the triggers anyone steps into (Teldrassil's).
class     = { type = "int", min = 1 }

[index]
byKind     = "kind"
byFromNode = "fromNode"
