set = "Tiles"
key = "int"              # continent * 4096 + row * 64 + column: the continent is the game's instance (0 Eastern Kingdoms, 1 Kalimdor), row and column its tile in the continent's grid of 64 x 64
pack = "World"
learn = false
about = "The terrain's pictures for the map: for every tile of a continent's grid that has one, the game's own minimap texture."

[fields]
minimap = { type = "int", min = 1 }   # the texture's file ID, as the continent's own file names it
