set = "TransmogSets"
key = "int"              # the game's transmog set ID
pack = "Collections"
learn = true             # C_TransmogSets
about = "The appearance sets: their names, for which classes, and the items whose looks make them."

[fields]
name    = { type = "text" }
classes = { type = "list", of = "int" }      # the game's class IDs; none: every class
items   = { type = "list", of = "int" }      # the items, by their ID

[index]
byItem = "items"
