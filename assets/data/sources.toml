# Every source a line of the master may name in its `src` (Doc/guides/data.md, *sources.toml*).
# A batch of staging gets a number, the game version its lines go to (`game`), where it was seen if that
# differs (`seen`), and the build it was read at (`build`, optional).
[game]
kind = "game"
about = "The game itself: its code (the newest export of its interface) and tables, its API, our crawls, scans and learned data."

[hand]
kind = "hand"
about = "Written by people: hand-made sets and the fixes."

[old]
kind = "batch"
game = "forever"
about = "The quest facts the Tooltips module shipped in its own file before the data framework (givers, takers, requirements, the items quests ask for, what creatures drop for them, chances in whole percent with 0 for under one), taken in once."

[1]
kind = "batch"
game = "forever"
build = 70245
about = "Herb and ore nodes: the original game's node types, one entry per name, each with the skill Forever's client asks for it (its lock table), where gathering it turns yellow and grey (Forever's own where its nodes carry it, else the original game's rule: 25 and 100 over its skill there), and the items it gives. Unverified, but for Forever's own new nodes."

[2]
kind = "batch"
game = "forever"
build = 70245
about = "Disenchanting: for each row of Forever's client table of disenchanting (an item's class, quality and item levels), the materials the original game gives for it, with their chances and counts. Unverified."

[3]
kind = "batch"
game = "forever"
seen = "forever-beta"
about = "What Forever's beta servers sent about NPCs and the world's objects (builds 70124 to 70374): NPCs with their titles, ranks, kinds, families, factions, services and goods, and their levels where those were sent too; the spawn points of NPCs with a service, rares, quest givers and takers, herb and ore nodes and treasure chests; mailboxes, meeting stones and spirit healers. Unverified."

[4]
kind = "batch"
game = "forever"
about = "The original game's NPCs and places (patch 1.12), only where every record of it agrees: NPCs with their titles, levels, ranks, kinds, families, factions, services, goods and a rare's respawn; the spawn points of NPCs with a service, rares, quest givers and takers, herb and ore nodes and treasure chests (none a holiday brings); mailboxes, meeting stones and spirit healers, but where Forever's beta showed the spot without one. Unverified: where an entry's points come from both batches, its version names both (batch 3's where Forever's beta showed the thing, this one's elsewhere)."

[5]
kind = "batch"
game = "forever"
about = "Quests, NPCs and places for Forever's client as our tool picked them, 2026-10-20: quests with their givers, takers, requirements, objectives (creatures to kill, objects to use, items to loot), starting items, reputation rewards and repeatability; NPCs with levels, ranks, factions, services and kinds of goods; what vendors sell (items only); which creatures and objects give quest items; spawn points of NPCs, quest objects and other creatures, herb and ore nodes and treasure chests, to a tenth of a percent of the zone map. Names are the game's wherever it gives them; only what agrees with the master or fills what it lacks. Unverified: the game's word or our own sightings replace it entry by entry."

[6]
kind = "batch"
game = "forever"
about = "The original game's boats and zeppelins (patch 1.12): the time each takes once round its way, where every record of it agrees to the millisecond and Forever's client has the same way, its points and stays alike. Unverified: a ride in play confirms it."

[7]
kind = "batch"
game = "forever"
seen = "forever-beta"
build = 70450
about = "What Forever's beta client and server held, 2026-10-18, that live's client does not hold yet: items, item sets, spells and Legacy entries the beta's server sent with its updates, read by dev/tools/game-data. Live's base until live's own client or server says it (decision 27). Unverified."

[8]
kind = "batch"
game = "forever"
seen = "forever-beta"
about = "What Forever's beta servers sent (builds 70124 to 70374) about trainers, vendors and creatures' paths: each spell a trainer teaches with its level, cost and the skill it needs (one answer from every trainer only); vendors' lists where they hold every item already known and more, with each limited item's stock; the paths creatures walk, where a creature has one. Unverified."

[9]
