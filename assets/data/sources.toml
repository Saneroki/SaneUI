about = "What Forever's beta and live servers told players' games, and what was recorded in play, up to 2026-10-28, as our tool picked it. The servers' answers: quests' names, levels, chains, objectives with their counts and texts, money, items, spells and reputation; creatures' titles, ranks, kinds and families; these correct what imports said. Experience: as turn-ins paid, else worked out from Forever's client (its table at the server's difficulty, times the server's multiplier). Recorded in play, filling only what the master lacks: creatures' levels, health and the spells they were seen to cast (their facts from Forever's client), services, vendors' goods, stocks and costs, flights' times, what creatures, nodes and chests gave in more than one window (no chances), and weapons' damage as the game's tooltip shows it. Unverified: the game's word or our own sightings replace it entry by entry."

