set = "Spells"
key = "int"              # the game's spell ID: one per rank
learn = true             # the game knows every spell by its ID: tooltips, the spellbook, the crawl
about = "The players' spells and abilities, every rank: what the game says of each, with its history."

# How play tells each field (Doc/guides/data.md, *Checked in play*): cost, cast time and range are the player's.
play = ["name", "rank", "icon"]
[fields]
name        = { type = "text" }            # in English (decisions 7 and 22)
rank        = { type = "text" }            # the game's rank line: Rank 3
description = { type = "text" }
icon        = { type = "int", min = 0 }
cost        = { type = "list", of = "tuple", parts = [
    { name = "power", type = "int" },      # Enum.PowerType
    { name = "amount", type = "int" },
] }
castTime    = { type = "int", min = 0 }    # in milliseconds; 0 instant
cooldown    = { type = "int", min = 0 }    # in milliseconds
minRange    = { type = "number", min = 0 } # in yards
maxRange    = { type = "number", min = 0 }
effects     = { type = "list", of = "tuple", parts = [   # what it does, as the client holds it: its numbers (SpellEffect)
    { name = "index", type = "int" },
    { name = "effect", type = "int" },     # the kind of effect
    { name = "aura", type = "int" },       # the kind of aura it puts on
    { name = "points", type = "number" },  # its base value
    { name = "perLevel", type = "number" },
    { name = "period", type = "int" },     # milliseconds between an aura's ticks
    { name = "targets", type = "int" },    # how many it chains to
    { name = "misc", type = "int" },       # the effect's own number: a school, a stat, a summoned creature
    { name = "trigger", type = "int" },    # the spell it sets off
] }

[index]
byName = "name"                            # every rank of Frostbolt
