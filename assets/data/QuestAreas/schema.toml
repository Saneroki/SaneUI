set = "QuestAreas"
key = "text"             # <quest>/<objective>/<stage>/<map>: one area per objective, stage and map
pack = "Spawns"
learn = true             # a cell where an objective's count went up is added (Doc/ideas/Data.md, *Quest areas*)
about = "Where a quest's objectives are found, as the game shades it on its map: cells in runs per row, with their middle and size."

[fields]
quest     = { type = "ref", set = "Quests" }
objective = { type = "int", min = 1 }
stage     = { type = "int", min = 1 }
map       = { type = "int", min = 0 }
runs      = { type = "list", of = "tuple", parts = [
    { name = "row", type = "int", min = 0, max = 99 },
    { name = "first", type = "int", min = 0, max = 99 },
    { name = "last", type = "int", min = 0, max = 99 },
] }
x         = { type = "number", min = 0, max = 100 }  # the middle, and the size
y         = { type = "number", min = 0, max = 100 }
size      = { type = "number", min = 0 }
from      = { type = "enum", values = ["game", "data", "play"] }  # the game's own area, made from the data, or learned

[index]
byQuest = "quest"
byMap   = "map"
