<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finished Maps</title>
<style>
  :root { --bg: #16171a; --panel: #1f2024; --line: #33353b; --text: #e7e3da; --dim: #9a958a; --accent: #d9a441;
          --ours: #8fbf7a; --game: #7aa6c9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; height: 100vh;
         display: grid; grid-template-columns: 250px 290px 1fr; grid-template-rows: auto 1fr; }
  header { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; padding: 10px 16px;
           border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  header .count { color: var(--dim); font-size: 12px; margin-right: auto; }
  button, select, input[type=search] { background: none; border: 1px solid var(--line); color: var(--text);
         padding: 5px 10px; border-radius: 6px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  select { background: var(--panel); width: 100%; }
  nav, aside { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; }
  nav { padding: 12px 0; }
  nav input { margin: 0 12px 10px; width: calc(100% - 24px); }
  nav h2, aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
         margin: 14px 12px 6px; font-weight: 600; }
  nav a { display: flex; align-items: center; gap: 6px; padding: 5px 12px; color: var(--text); text-decoration: none;
          border-left: 2px solid transparent; }
  nav a:hover { background: #26272c; }
  nav a[aria-current="true"] { border-left-color: var(--accent); background: #2a2a2e; color: var(--accent); }
  nav a .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10px; font-weight: 700; width: 16px; height: 16px; border-radius: 3px; display: inline-grid;
           place-items: center; color: #16171a; background: var(--ours); }
  .badge.off { background: none; color: #4a4c52; border: 1px solid #3a3c42; }
  aside { padding: 0 16px 16px; }
  aside h2 { margin: 16px 0 8px; }
  aside h2.map { font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--text); }
  .layer { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .layer label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .layer .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .layer input[type=range] { width: 100%; margin-top: 6px; accent-color: var(--accent); }
  .layer .value { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  .row { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .pick { margin-top: 10px; }
  .pick span { display: block; color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 16px; }
  main { position: relative; overflow: hidden; cursor: grab; touch-action: none; }
  main.dragging { cursor: grabbing; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #stage img { position: absolute; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  #divider { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); cursor: ew-resize;
             display: none; z-index: 5; }
  #divider::after { content: "⇔"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
             background: var(--accent); color: #16171a; border-radius: 50%; width: 28px; height: 28px;
             display: grid; place-items: center; font-size: 15px; }
  .swipe #divider { display: block; }
  .tag { position: absolute; top: 10px; background: rgba(0,0,0,.65); padding: 3px 8px; border-radius: 4px;
         font-size: 12px; display: none; z-index: 4; }
  .swipe .tag { display: block; }
  #tagA { left: 10px; } #tagB { right: 10px; }
  #where { position: absolute; right: 12px; bottom: 10px; background: rgba(0,0,0,.6); padding: 4px 8px;
           border-radius: 4px; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto auto 1fr; height: auto; min-height: 100vh; }
    nav, aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 30vh; }
    main { height: 70vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Finished maps</h1><span class="count" id="count"></span>
  <button id="modeOverlay" aria-pressed="true">Overlay</button>
  <button id="modeSwipe" aria-pressed="false">Side by side</button>
</header>
<nav><input type="search" id="filter" placeholder="Find a map" aria-label="Find a map"><div id="list"></div></nav>
<aside>
  <h2 class="map" id="subject"></h2>
  <div id="overlay">
    <div id="layers"></div>
    <div class="row">
      <button id="ours">Ours only</button>
      <button id="game">Game only</button>
      <button id="fit">Fit</button>
    </div>
  </div>
  <div id="swipe" hidden>
    <label class="pick"><span>Left of the divider</span><select id="pickA"></select></label>
    <label class="pick"><span>Right of the divider</span><select id="pickB"></select></label>
    <div class="row"><button id="flip">Swap sides</button><button id="fit2">Fit</button></div>
  </div>
  <p class="hint">Wheel or pinch to zoom, drag to pan. Each picture is laid by its box in the world, so where they
    agree they lie exactly over each other. Keys: ↑ ↓ the previous or next map.</p>
</aside>
<main id="view"><div id="stage"></div><div id="divider"></div><span class="tag" id="tagA"></span>
  <span class="tag" id="tagB"></span><div id="where"></div></main>
<script src="maps.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const view = $("view"), stage = $("stage"), divider = $("divider");
const W = 2000;   // the stage's width in its own pixels: the map's box spans it
const LETTER = { close: "C", middle: "M", far: "F" };
let map = null, scale = 1, panX = 0, panY = 0, swipe = false, cut = 0.5, imgs = [];

const stored = (key, fallback) => { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } };
const store = (key, value) => { try { localStorage.setItem(key, value); } catch {} };

function place() { stage.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`; clip(); }

function fit() {
  const [n, s, w, e] = map.box, h = W * (n - s) / (w - e);
  scale = Math.min(view.clientWidth / W, view.clientHeight / h) * 0.96;
  panX = (view.clientWidth - W * scale) / 2; panY = (view.clientHeight - h * scale) / 2; place();
}

function list() {
  const words = $("filter").value.trim().toLowerCase(), box = $("list");
  box.innerHTML = "";
  for (const [kind, heading] of [["zone", "Zones"], ["instance", "Dungeons and raids"]]) {
    const shown = MAPS.filter(m => m.kind === kind && m.title.toLowerCase().includes(words));
    if (!shown.length) continue;
    box.insertAdjacentHTML("beforeend", `<h2>${heading} (${shown.length})</h2>`);
    for (const m of shown) {
      const a = document.createElement("a");
      a.href = "#" + m.name;
      a.setAttribute("aria-current", map && m.name === map.name);
      a.innerHTML = `<span class="title">${m.title}</span>` + ["close", "middle", "far"].map(l =>
        `<span class="badge ${m.levels.includes(l) ? "" : "off"}" title="${l} level">${LETTER[l]}</span>`).join("");
      box.appendChild(a);
    }
  }
}

function show(name) {
  map = MAPS.find(m => m.name === name) || MAPS[0];
  store("map", map.name);
  $("subject").textContent = map.title;
  const [N, S, Wst, E] = map.box, k = W / (Wst - E);
  stage.innerHTML = ""; stage.style.width = W + "px"; stage.style.height = (N - S) * k + "px";
  const saved = JSON.parse(stored("on-" + map.name, "{}"));
  const fresh = !Object.keys(saved).length, top = map.layers.filter(l => l.side === "ours").pop();
  $("layers").innerHTML = "";
  imgs = map.layers.map((layer, i) => {
    const [n, s, w, e] = layer.box, img = new Image();
    img.src = layer.file; img.alt = layer.name;
    Object.assign(img.style, { left: (Wst - w) * k + "px", top: (N - n) * k + "px", width: (w - e) * k + "px",
                               height: (n - s) * k + "px", zIndex: i });
    stage.appendChild(img);
    const on = fresh ? (layer.key === "terrain" || layer === top ? 100 : 0) : (saved[layer.key] ?? 0);
    const row = document.createElement("div"); row.className = "layer";
    row.innerHTML = `<label><input type="checkbox" ${on ? "checked" : ""}>
      <span class="dot" style="background:var(--${layer.side})"></span>${layer.name}<span class="value"></span></label>
      <input type="range" min="0" max="100" value="${on || 100}" aria-label="${layer.name} opacity">`;
    const tick = row.querySelector("input[type=checkbox]"), range = row.querySelector("input[type=range]");
    layer.value = () => tick.checked ? +range.value : 0;
    layer.apply = () => { row.querySelector(".value").textContent = layer.value() + "%"; draw(); };
    layer.set = (v) => { tick.checked = v > 0; if (v > 0) range.value = v; layer.apply(); };
    tick.addEventListener("change", layer.apply);
    range.addEventListener("input", () => { tick.checked = true; layer.apply(); });
    $("layers").appendChild(row);
    row.querySelector(".value").textContent = on + "%";
    return img;
  });
  for (const id of ["pickA", "pickB"])
    $(id).innerHTML = map.layers.map((l, i) => `<option value="${i}">${l.name}</option>`).join("");
  const game = map.layers.findIndex(l => l.side === "game" && l.key !== "terrain");
  $("pickA").value = game >= 0 ? game : 0;
  $("pickB").value = map.layers.indexOf(top);
  list(); draw(); fit();
  document.title = `${map.title} · Finished Maps`;
}

function draw() {
  const a = +$("pickA").value, b = +$("pickB").value, saved = {};
  map.layers.forEach((layer, i) => {
    saved[layer.key] = layer.value();
    imgs[i].style.opacity = swipe ? (i === a || i === b ? 1 : 0) / 1 : layer.value() / 100;
    imgs[i].style.zIndex = swipe ? (i === b ? 2 : 1) : i;
  });
  if (!swipe) store("on-" + map.name, JSON.stringify(saved));
  $("tagA").textContent = map.layers[a].name; $("tagB").textContent = map.layers[b].name;
  clip();
}

function clip() {   // side by side: the right-hand picture shows only right of the divider
  if (!map) return;
  const x = cut * view.clientWidth;
  divider.style.left = x - 1 + "px";
  imgs.forEach((img, i) => {
    if (!swipe || i !== +$("pickB").value) { img.style.clipPath = ""; return; }
    const from = (x - panX) / scale - parseFloat(img.style.left);
    img.style.clipPath = `inset(0 0 0 ${Math.max(0, from)}px)`;
  });
}

function mode(on) {
  swipe = on; store("mode", on ? "swipe" : "overlay");
  document.body.classList.toggle("swipe", on);
  $("modeOverlay").setAttribute("aria-pressed", !on); $("modeSwipe").setAttribute("aria-pressed", on);
  $("overlay").hidden = on; $("swipe").hidden = !on;
  draw();
}

$("count").textContent = `${MAPS.length} maps · ${MAPS.filter(m => m.levels.includes("far")).length} far, ` +
  `${MAPS.filter(m => m.levels.includes("middle")).length} middle, ${MAPS.filter(m => m.levels.includes("close")).length} close`;
$("filter").addEventListener("input", list);
$("modeOverlay").addEventListener("click", () => mode(false));
$("modeSwipe").addEventListener("click", () => mode(true));
$("fit").addEventListener("click", fit); $("fit2").addEventListener("click", fit);
$("pickA").addEventListener("change", draw); $("pickB").addEventListener("change", draw);
$("flip").addEventListener("click", () => { const a = $("pickA").value; $("pickA").value = $("pickB").value;
                                            $("pickB").value = a; draw(); });
$("ours").addEventListener("click", () => { const top = map.layers.filter(l => l.side === "ours").pop();
                                            map.layers.forEach(l => l.set(l === top ? 100 : 0)); });
$("game").addEventListener("click", () => map.layers.forEach(l => l.set(l.side === "game" ? 100 : 0)));
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
window.addEventListener("resize", () => map && fit());
document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT") return;
  if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
  const links = [...document.querySelectorAll("nav a")], at = links.findIndex(a => a.getAttribute("aria-current") === "true");
  const next = links[Math.min(Math.max(at + (ev.key === "ArrowDown" ? 1 : -1), 0), links.length - 1)];
  if (next) { ev.preventDefault(); location.hash = next.getAttribute("href"); next.scrollIntoView({ block: "nearest" }); }
});

view.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const r = view.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const f = Math.exp(-ev.deltaY * 0.0015), next = Math.min(Math.max(scale * f, 0.05), 30);
  panX = x - (x - panX) * next / scale; panY = y - (y - panY) * next / scale; scale = next; place();
}, { passive: false });
const pointers = new Map();
let drag = null, pinch = null, cutting = false;
divider.addEventListener("pointerdown", (ev) => { ev.stopPropagation(); cutting = true; divider.setPointerCapture(ev.pointerId); });
divider.addEventListener("pointermove", (ev) => {
  if (!cutting) return;
  const r = view.getBoundingClientRect();
  cut = Math.min(Math.max((ev.clientX - r.left) / r.width, 0), 1); clip();
});
divider.addEventListener("pointerup", () => { cutting = false; });
view.addEventListener("pointerdown", (ev) => {
  pointers.set(ev.pointerId, [ev.clientX, ev.clientY]); view.setPointerCapture(ev.pointerId);
  if (pointers.size === 1) { drag = [ev.clientX - panX, ev.clientY - panY]; view.classList.add("dragging"); }
  if (pointers.size === 2) { const [p, q] = [...pointers.values()]; pinch = [Math.hypot(p[0] - q[0], p[1] - q[1]), scale]; drag = null; }
});
view.addEventListener("pointermove", (ev) => {
  const r = view.getBoundingClientRect(), [N, , Wst, E] = map.box, k = W / (Wst - E);
  const sx = (ev.clientX - r.left - panX) / scale, sy = (ev.clientY - r.top - panY) / scale;
  $("where").textContent = `x ${(N - sy / k).toFixed(0)}  y ${(Wst - sx / k).toFixed(0)}`;
  if (!pointers.has(ev.pointerId)) return;
  pointers.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if (pinch && pointers.size === 2) {
    const [p, q] = [...pointers.values()], x = (p[0] + q[0]) / 2 - r.left, y = (p[1] + q[1]) / 2 - r.top;
    const next = Math.min(Math.max(pinch[1] * Math.hypot(p[0] - q[0], p[1] - q[1]) / pinch[0], 0.05), 30);
    panX = x - (x - panX) * next / scale; panY = y - (y - panY) * next / scale; scale = next; place();
  } else if (drag) { panX = ev.clientX - drag[0]; panY = ev.clientY - drag[1]; place(); }
});
const release = (ev) => { pointers.delete(ev.pointerId); if (pointers.size < 2) pinch = null;
                          if (!pointers.size) { drag = null; view.classList.remove("dragging"); } };
view.addEventListener("pointerup", release); view.addEventListener("pointercancel", release);

show(location.hash.slice(1) || stored("map", ""));
mode(stored("mode", "overlay") === "swipe");
</script>
<script src="/web-nav.js" defer></script>
</body>
</html>
