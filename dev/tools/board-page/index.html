<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sane UI Board</title>
<style>
:root {
  --bg: #f4f1ea; --panel: #ebe6db; --card: #fffdf8; --line: #d9d2c3; --text: #2b2722; --muted: #776f62;
  --accent: #8a5a2b; --accent-soft: #f1e4d3; --shadow: 0 1px 2px rgba(60, 45, 20, .08), 0 2px 8px rgba(60, 45, 20, .06);
  --high: #c2412d; --medium: #c9892a; --low: #5f8a6a; --drop: #8a5a2b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a18; --panel: #24221f; --card: #2e2b27; --line: #3b3732; --text: #ece6dc; --muted: #a39a8c;
    --accent: #d9a56b; --accent-soft: #3a3027; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 2px 8px rgba(0, 0, 0, .25);
    --high: #e0644f; --medium: #e0a54a; --low: #7fb08a; --drop: #d9a56b;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1a18; --panel: #24221f; --card: #2e2b27; --line: #3b3732; --text: #ece6dc; --muted: #a39a8c;
  --accent: #d9a56b; --accent-soft: #3a3027; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 2px 8px rgba(0, 0, 0, .25);
  --high: #e0644f; --medium: #e0a54a; --low: #7fb08a; --drop: #d9a56b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-size: 17px; margin: 0 8px 0 0; letter-spacing: .02em; }
h1 span { color: var(--accent); }
.search { flex: 1 1 220px; max-width: 360px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
select.area { padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); max-width: 200px; }
.primary { background: var(--accent); color: var(--card); border: 0; border-radius: 8px; padding: 7px 14px; font-weight: 600; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.spacer { flex: 1; }
.status { font-size: 12px; color: var(--muted); }
.status.off { color: var(--high); }

main { flex: 1; display: flex; gap: 14px; padding: 16px 20px; overflow-x: auto; align-items: stretch; min-height: 0; }
.column { flex: 1 0 240px; max-width: 380px; display: flex; flex-direction: column; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; min-height: 0; }
.column header { all: unset; display: flex; align-items: baseline; gap: 8px; padding: 12px 12px 4px; }
.column h2 { font-size: 14px; margin: 0; }
.column .count { color: var(--muted); font-size: 12px; }
.column .means { color: var(--muted); font-size: 12px; padding: 0 12px 8px; }
.column .tools { margin-left: auto; display: flex; gap: 2px; }
.icon { background: none; border: 0; border-radius: 6px; width: 26px; height: 26px; color: var(--muted); font-size: 16px; line-height: 1; }
.icon:hover { background: var(--accent-soft); color: var(--text); }
.list { flex: 1; overflow-y: auto; padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
.list.over { background: var(--accent-soft); border-radius: 0 0 12px 12px; }
.more { color: var(--muted); font-size: 12px; text-align: center; padding: 4px; background: none; border: 0; }

.card { touch-action: none; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--medium); border-radius: 8px;
  padding: 8px 10px 8px 10px; box-shadow: var(--shadow); cursor: grab; user-select: none; position: relative; }
.card.high { border-left-color: var(--high); }
.card.low { border-left-color: var(--low); }
.card:hover { border-color: var(--accent); border-left-color: inherit; }
.card.high:hover { border-left-color: var(--high); } .card.medium:hover { border-left-color: var(--medium); }
.card.low:hover { border-left-color: var(--low); }
.card.dragging { opacity: .35; }
.card .title { font-weight: 550; word-wrap: break-word; }
.card .meta { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
.card .tag { background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; color: var(--text); }
.card .notes { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.card .by { margin-left: auto; }
.card.fresh { animation: fresh 1.6s ease-out; }
@keyframes fresh { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: var(--shadow); } }
.done .card .title { text-decoration: line-through; text-decoration-color: var(--muted); }
.drop-line { height: 3px; background: var(--drop); border-radius: 2px; margin: -5px 0; }

.quick { padding: 0 10px 10px; }
.quick textarea { width: 100%; resize: none; border: 1px solid var(--accent); border-radius: 8px; padding: 8px;
  background: var(--card); min-height: 58px; }
.quick .row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }

dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(620px, calc(100vw - 32px));
  background: var(--card); color: var(--text); box-shadow: 0 10px 40px rgba(0, 0, 0, .3); }
dialog::backdrop { background: rgba(20, 15, 10, .45); }
dialog form { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
dialog .head { display: flex; align-items: center; gap: 10px; }
dialog .head .id { color: var(--muted); font-size: 13px; }
dialog input.title { font-size: 17px; font-weight: 600; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px;
  background: none; flex: 1; }
dialog input.title:hover, dialog input.title:focus { border-color: var(--line); background: var(--bg); outline: none; }
dialog label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
dialog textarea, dialog .field { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); }
dialog textarea { min-height: 140px; resize: vertical; }
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--bg); padding: 7px 4px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; }
.log { font-size: 12px; color: var(--muted); max-height: 120px; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 8px; }
.log div { padding: 1px 0; }
.foot { display: flex; gap: 8px; align-items: center; }
.danger { background: none; border: 1px solid var(--line); color: var(--high); border-radius: 8px; padding: 7px 12px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 11px; }

@media (max-width: 700px) {
  header { padding: 10px 16px; }
  main { padding: 12px 16px; flex-direction: column; overflow-x: hidden; }
  .column { max-width: none; flex: 0 0 auto; }
  .list { max-height: 60vh; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>Sane UI <span>Board</span></h1>
  <input class="search" id="search" type="search" placeholder="Search cards  ( / )">
  <div class="chips" id="prios"></div>
  <select class="area" id="area"><option value="">Every area</option></select>
  <span class="spacer"></span>
  <span class="status" id="status"></span>
  <button class="ghost" id="theme" title="Light or dark">◐</button>
  <button class="primary" id="new">+ New card <kbd>N</kbd></button>
</header>
<main id="board"></main>

<dialog id="edit">
  <form method="dialog" id="form">
    <div class="head"><span class="id" id="f-id"></span><input class="title" id="f-title" placeholder="What is to be done" required></div>
    <div class="grid">
      <label>Priority<div class="seg" id="f-prio"></div></label>
      <label>Column<select class="field" id="f-column"></select></label>
      <label>Area<input class="field" id="f-area" list="areas" placeholder="e.g. Combat"></label>
    </div>
    <label>Notes<textarea id="f-notes" placeholder="Details, links to plans, what done looks like"></textarea></label>
    <div class="log" id="f-log"></div>
    <div class="foot">
      <button type="button" class="danger" id="f-delete">Delete</button>
      <span class="spacer"></span>
      <span class="status"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> saves</span>
      <button type="button" class="ghost" id="f-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>
<datalist id="areas"></datalist>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem("board." + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("board." + k, JSON.stringify(v)); } catch {} } };
let state = null, version = -1, editing = null, dragId = null, seen = new Set();
const filter = { text: "", prios: new Set(store.get("prios", [])), area: store.get("area", "") };
const DONE_SHOWN = 25;
let doneAll = false, quickAt = null, pending = false;

function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(t.timer);
  t.timer = setTimeout(() => t.classList.remove("show"), 2200); }

async function send(op) {
  const res = await fetch("/api/op", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...op, by: "Saneroki" }) });
  const body = await res.json();
  if (!res.ok) { toast(body.error || "Not saved"); return false; }
  take(body); return true;
}

async function poll() {
  try {
    const res = await fetch("/api/board?after=" + version);
    const body = await res.json();
    if (!body.same) take(body);
    $("status").textContent = "synced"; $("status").classList.remove("off");
  } catch { $("status").textContent = "server not reachable"; $("status").classList.add("off"); }
  setTimeout(poll, 1500);
}

function take(body) {
  const first = state === null;
  const before = new Map((state?.board.cards || []).map((c) => [c.id, c.updated]));
  state = body; version = body.board.version;
  seen = new Set(first ? [] : body.board.cards.filter((c) => before.get(c.id) !== c.updated && c.by !== "Saneroki").map((c) => c.id));
  render();
}

function matches(card) {
  if (filter.prios.size && !filter.prios.has(card.priority)) return false;
  if (filter.area && card.area !== filter.area) return false;
  if (filter.text) {
    const t = filter.text.toLowerCase();
    if (!(card.title + " " + card.notes + " " + card.area + " #" + card.id).toLowerCase().includes(t)) return false;
  }
  return true;
}

function render() {
  if (!state) return;
  if (dragId !== null) { pending = true; return; }   // drawn again once the drag ends
  pending = false;
  const typing = document.activeElement?.closest?.(".quick") ? document.activeElement.selectionStart : null;
  const { board, columns, priorities } = state;
  // filters
  $("prios").replaceChildren(...priorities.map((p) => {
    const b = el("button", "chip", "");
    b.innerHTML = `<i style="background:var(--${p})"></i>${p}`;
    b.setAttribute("aria-pressed", filter.prios.has(p));
    b.onclick = () => { filter.prios.has(p) ? filter.prios.delete(p) : filter.prios.add(p); store.set("prios", [...filter.prios]); render(); };
    return b;
  }));
  const areas = [...new Set(board.cards.map((c) => c.area).filter(Boolean))].sort();
  $("area").replaceChildren(new Option("Every area", ""), ...areas.map((a) => new Option(a, a)));
  $("area").value = areas.includes(filter.area) ? filter.area : "";
  $("areas").replaceChildren(...areas.map((a) => new Option(a)));

  const scroll = {};
  document.querySelectorAll(".list").forEach((l) => (scroll[l.dataset.column] = l.scrollTop));
  $("board").replaceChildren(...columns.map((col) => {
    const all = board.cards.filter((c) => c.column === col.key);
    let cards = all.filter(matches);
    const box = el("section", "column" + (col.key === "done" ? " done" : ""));
    const head = el("header");
    head.append(el("h2", "", col.name), el("span", "count", cards.length === all.length ? all.length : `${cards.length} of ${all.length}`));
    const tools = el("div", "tools");
    const add = el("button", "icon", "+"); add.title = "Add a card here"; add.onclick = () => quick(box, col.key);
    const sort = el("button", "icon", "⇅"); sort.title = "Sort by priority";
    sort.onclick = () => sortColumn(col.key);
    tools.append(sort, add); head.append(tools);
    box.append(head, el("div", "means", col.means));
    if (quickAt?.key === col.key) box.append(quickEl());
    const list = el("div", "list"); list.dataset.column = col.key;
    let shown = cards;
    if (col.key === "done" && !doneAll && cards.length > DONE_SHOWN) shown = cards.slice(-DONE_SHOWN);
    if (shown.length < cards.length) {
      const more = el("button", "more", `${cards.length - shown.length} older ones`); more.onclick = () => { doneAll = true; render(); };
      list.append(more);
    }
    shown.forEach((c) => list.append(cardEl(c)));
    box.append(list);
    return box;
  }));
  document.querySelectorAll(".list").forEach((l) => (l.scrollTop = scroll[l.dataset.column] || 0));
  const q = document.querySelector(".quick textarea");
  if (q && (typing !== null || quickAt.focus)) { quickAt.focus = false; q.focus(); q.selectionStart = q.selectionEnd = typing ?? q.value.length; }
}

function el(tag, cls = "", text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function cardEl(c) {
  const e = el("article", `card ${c.priority}` + (seen.has(c.id) ? " fresh" : ""));
  e.dataset.id = c.id; e.tabIndex = 0;
  e.append(el("div", "title", c.title));
  if (c.notes) e.append(el("div", "notes", c.notes));
  const meta = el("div", "meta");
  meta.append(el("span", "", "#" + c.id));
  if (c.area) meta.append(el("span", "tag", c.area));
  meta.append(el("span", "by", c.by === "Saneroki" ? "" : c.by));
  e.append(meta);
  e.onkeydown = (ev) => { if (ev.key === "Enter") open(c.id); };
  e.onpointerdown = (ev) => press(ev, e, c.id);
  return e;
}

// Dragging by pointer (mouse, pen and touch alike): a press that moves a few pixels lifts the card, a copy
// follows the pointer, a line shows where it lands; a press that does not move opens the card.
let drag = null;

function press(ev, card, id) {
  if (ev.button !== 0) return;
  const r = card.getBoundingClientRect();
  drag = { id, card, x: ev.clientX, y: ev.clientY, dx: ev.clientX - r.left, dy: ev.clientY - r.top, ghost: null, at: null };
  card.setPointerCapture(ev.pointerId);
  card.onpointermove = moved;
  card.onpointerup = card.onpointercancel = (up) => released(up, up.type === "pointercancel");
}

function moved(ev) {
  if (!drag) return;
  if (!drag.ghost) {
    if (Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) < 6) return;
    dragId = drag.id;
    const r = drag.card.getBoundingClientRect();
    drag.ghost = drag.card.cloneNode(true);
    Object.assign(drag.ghost.style, { position: "fixed", width: r.width + "px", pointerEvents: "none", zIndex: 10,
      transform: "rotate(2deg)", boxShadow: "0 10px 30px rgba(0,0,0,.3)", cursor: "grabbing" });
    document.body.append(drag.ghost);
    drag.card.classList.add("dragging");
    document.body.style.cursor = "grabbing";
  }
  drag.ghost.style.left = ev.clientX - drag.dx + "px";
  drag.ghost.style.top = ev.clientY - drag.dy + "px";
  drag.px = ev.clientX; drag.py = ev.clientY;
  aim();
  if (!drag.scroller) drag.scroller = setInterval(edgeScroll, 30);
}

function aim() {
  clearLines();
  const under = document.elementFromPoint(drag.px, drag.py);
  const list = under?.closest(".list") || under?.closest(".column")?.querySelector(".list");
  drag.at = null;
  if (!list) return;
  list.classList.add("over");
  const before = [...list.querySelectorAll(".card:not(.dragging)")].find((c) => {
    const r = c.getBoundingClientRect(); return drag.py < r.top + r.height / 2; });
  const line = el("div", "drop-line");
  before ? list.insertBefore(line, before) : list.append(line);
  drag.at = { list, key: list.dataset.column, before: before ? Number(before.dataset.id) : null };
}

function edgeScroll() {   // near a list's or the board's edge, scroll it
  if (!drag?.ghost) return;
  const step = (pos, lo, hi) => (pos < lo + 40 ? -12 : pos > hi - 40 ? 12 : 0);
  const main = $("board"), m = main.getBoundingClientRect();
  const h = step(drag.px, m.left, m.right), list = drag.at?.list;
  if (h) main.scrollLeft += h;
  if (list) { const r = list.getBoundingClientRect(), v = step(drag.py, r.top, r.bottom); if (v) list.scrollTop += v; }
  if (h || list) aim();
}

async function released(ev, cancelled) {
  const d = drag; drag = null;
  if (!d) return;
  clearInterval(d.scroller);
  d.card.onpointermove = d.card.onpointerup = d.card.onpointercancel = null;
  if (!d.ghost) { if (!cancelled) open(d.id); return; }
  d.ghost.remove(); d.card.classList.remove("dragging"); document.body.style.cursor = "";
  clearLines(); dragId = null;
  if (cancelled || !d.at) { if (pending) render(); return; }
  const { list, key } = d.at;
  const cards = state.board.cards.filter((c) => c.column === key && c.id !== d.id);
  let before = d.at.before;
  if (before === null) {   // the end of a filtered column: after the last card shown, not after hidden ones
    const shown = [...list.querySelectorAll(".card")].map((c) => Number(c.dataset.id)).filter((x) => x !== d.id);
    const at = cards.findIndex((c) => c.id === shown[shown.length - 1]);
    if (at >= 0 && at < cards.length - 1) before = cards[at + 1].id;
  }
  const card = state.board.cards.find((c) => c.id === d.id), all = state.board.cards.filter((c) => c.column === key);
  const next = all[all.findIndex((c) => c.id === d.id) + 1];
  if (card.column === key && (before === (next ? next.id : null))) { if (pending) render(); return; }   // put back where it was
  if (await send({ op: "move", id: d.id, column: key, before }) && card.column !== key)
    toast(`#${d.id} → ${state.columns.find((c) => c.key === key).name}`);
}

function clearLines() { document.querySelectorAll(".drop-line").forEach((l) => l.remove());
  document.querySelectorAll(".list.over").forEach((l) => l.classList.remove("over")); }

async function sortColumn(key) {
  const rank = { high: 0, medium: 1, low: 2 };
  const cards = state.board.cards.filter((c) => c.column === key);
  const sorted = [...cards].sort((a, b) => rank[a.priority] - rank[b.priority]);
  if (sorted.every((c, i) => c.id === cards[i].id)) return toast("Already in priority order");
  for (let i = sorted.length - 1; i >= 0; i--)   // from the end: each card before the one after it
    await send({ op: "move", id: sorted[i].id, column: key, before: i + 1 < sorted.length ? sorted[i + 1].id : null });
  toast("Sorted by priority");
}

function quick(box, key) {
  if (!quickAt || quickAt.key !== key) quickAt = { key, prio: "medium", text: "" };
  quickAt.focus = true;
  render();
}

function quickEl() {
  const q = el("div", "quick"), t = el("textarea"); t.placeholder = "Title, Enter adds  (Shift+Enter: one more line)";
  t.value = quickAt.text;
  t.oninput = () => (quickAt.text = t.value);
  const row = el("div", "row"), seg = el("div", "seg"); seg.style.flex = "1";
  ["high", "medium", "low"].forEach((p) => { const b = el("button", "", p); b.type = "button";
    b.setAttribute("aria-pressed", p === quickAt.prio);
    b.onclick = () => { quickAt.prio = p; seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); t.focus(); };
    seg.append(b); });
  const close = el("button", "icon", "×"); close.type = "button"; close.title = "Close (Esc)";
  close.onclick = () => { quickAt = null; render(); };
  row.append(seg, close); q.append(t, row);
  t.onkeydown = async (ev) => {
    if (ev.key === "Escape") { quickAt = null; render(); }
    if (ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      const [title, ...rest] = t.value.trim().split("\n");
      if (!title) return;
      const at = quickAt, typed = t.value;
      t.value = at.text = "";   // at once, so what is typed next is the next card
      if (!await send({ op: "add", title, notes: rest.join("\n"), priority: at.prio, column: at.key, area: filter.area, top: true })) {
        at.text = typed + at.text; render();
      }
    }
  };
  return q;
}

function open(id) {
  const card = id ? state.board.cards.find((c) => c.id === id) : null;
  editing = card ? card.id : null;
  $("f-id").textContent = card ? "#" + card.id : "New card";
  $("f-title").value = card?.title || "";
  $("f-notes").value = card?.notes || "";
  $("f-area").value = card?.area ?? filter.area;
  $("f-column").replaceChildren(...state.columns.map((c) => new Option(c.name, c.key)));
  $("f-column").value = card?.column || "backlog";
  setPrio(card?.priority || "medium");
  $("f-log").replaceChildren(...(card?.log || []).slice().reverse().map(([when, by, text]) => el("div", "", `${when} · ${by}: ${text}`)));
  $("f-log").hidden = !card;
  $("f-delete").hidden = !card;
  $("edit").showModal();
  (card ? $("f-notes") : $("f-title")).focus();
}

function setPrio(p) {
  $("f-prio").dataset.value = p;
  $("f-prio").replaceChildren(...state.priorities.map((x) => { const b = el("button", "", x); b.type = "button";
    b.setAttribute("aria-pressed", x === p); b.onclick = () => setPrio(x); return b; }));
}

async function save() {
  const fields = { title: $("f-title").value, notes: $("f-notes").value, area: $("f-area").value,
    priority: $("f-prio").dataset.value };
  if (!fields.title.trim()) return toast("A card needs a title");
  const column = $("f-column").value;
  let ok;
  if (editing === null) ok = await send({ op: "add", ...fields, column, top: true });
  else {
    const card = state.board.cards.find((c) => c.id === editing);
    ok = await send({ op: "edit", id: editing, ...fields });
    if (ok && card && card.column !== column) ok = await send({ op: "move", id: editing, column, top: true });
  }
  if (ok) $("edit").close();
}

$("form").onsubmit = (ev) => { ev.preventDefault(); save(); };
$("form").onkeydown = (ev) => { if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); save(); } };
$("f-cancel").onclick = () => $("edit").close();
$("f-delete").onclick = async () => {
  const card = state.board.cards.find((c) => c.id === editing);
  if (card && confirm(`Delete #${card.id} “${card.title}”?`) && await send({ op: "delete", id: editing })) {
    $("edit").close(); toast(`Deleted #${card.id}`);
  }
};
$("new").onclick = () => open(null);
$("search").oninput = (ev) => { filter.text = ev.target.value.trim(); render(); };
$("area").onchange = (ev) => { filter.area = ev.target.value; store.set("area", filter.area); render(); };
document.documentElement.dataset.theme = store.get("look", "dark");   // dark unless light was chosen
$("theme").onclick = () => {
  const dark = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() === "#1b1a18";
  document.documentElement.dataset.theme = dark ? "light" : "dark"; store.set("look", dark ? "light" : "dark");
};
document.addEventListener("keydown", (ev) => {
  if ($("edit").open || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (ev.key === "n" || ev.key === "N") { ev.preventDefault(); open(null); }
  if (ev.key === "/") { ev.preventDefault(); $("search").focus(); }
});
poll();
</script>
<script src="/web-nav.js" defer></script>
</body>
</html>
