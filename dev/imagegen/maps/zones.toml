# Zone briefs for the painted view of the map.
#
# The world is cut into squares, and a local image model repaints each square's terrain, seen from above, in the
# chosen look (dev/imagegen/sets/maps-pilot/close.txt: the terrain the one picture, the look in fixed words).
# The words for a square are put together by a tool from this file: it takes the brief of every zone and city
# that lies in the square and joins their prompt fields; squares of open water take the table "sea" at the end,
# whose "life" lists the small looped sprites that roam the sea.
#
# One table per map, keyed by the map's UiMap ID, sorted by continent and then by name.
# name, continent, kind and side are for people reading the file and for the tool; they never go into a
# prompt. Every other field is prompt words and names nothing: a proper name in the words makes the model
# write garbled letters into the picture, so places, peoples and factions are described, never named. Kinds
# of people and creatures are common nouns, written in lower case (humans, orcs, night elves, tauren).
# Caves, mines, dungeon and raid entrances and the ways into the next zone (passes, tunnels, border
# bridges) are left out: the map shows them as pins, not in the painting. Gates, walls and bridges that
# belong to a town's or a city's look stay.
# atmosphere is the zone's own light, air, colour and state, so that every zone feels like itself in the one
# photorealistic look.
# Positions are compass directions within the map, north up. Limits in words: land 60, plants 40,
# colours 25, buildings 50, roads 50, places 120, layout 120, atmosphere 30 to 55, prompt 60 to 110.

