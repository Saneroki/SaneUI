plants = "Golden-green grass and a few slim dark trees on the plain below; sparse grass on the mesa tops."
colours = "ochre-to-tan sandstone with red bands, golden-green grass, cream hide tents, bright red, blue and yellow totem paint, bridge wood"
buildings = "Tauren: hide tents and longhouses in cream, painted in patterns of red, blue and yellow; tall painted totems; spirit lodges; long bridges of wood and rope between the mesas; lifts driven by windmills at the foot of the cliffs."
roads = "No roads on the mesas: bridges of wood and rope link the central mesa with the other three. Lifts climb the central mesa's west-south-west side and its north side; from their foot a dirt track runs south across the plain."
places = "On the central mesa: a tall totem tower with the wind-rider roost, the great hall of the high chieftain on its east side, the market and the inn. On the north-western mesa, spirit lodges. On the north-eastern mesa, the elders' lodges. On the southern mesa, the hunters' lodges. Lifts with windmills on the west-south-west and north sides of the central mesa."
layout = "The central mesa, the largest, fills the middle: tents, longhouses and painted totems around a tall totem tower with a wind-rider roost, the great hall on its east side. North-west: a smaller mesa of spirit lodges. North-east: a mesa of elders' lodges. South: a mesa of hunters' lodges. Long wooden and rope bridges link each outer mesa to the central one. Two pairs of windmill-driven lifts climb the central mesa, on its west-south-west side and on its north side. No walls or gates: the sheer cliffs are the defence, and the plain lies all round."
mood = "A proud, windswept high city of hide tents under a wide sky."
atmosphere = "Bright, clean, wind-swept sunlight, colours warm ochre and cream with bold red, blue and yellow paint, the air clear. Everything is proud and peaceful: every hide taut and mended, thin cooking smoke, blankets airing, painted hides and streamers fluttering in the wind, and well-worn paths of packed earth."
prompt = "Four steep flat-topped table-mountains of ochre and tan sandstone with red bands, seen from above as flat tops ringed by the dark shadow of their cliffs, rising from rolling golden-green grassland. Their tops are dotted with round cream hide tents, longhouses painted in red, blue and yellow, and tall colourful totem poles; the largest mesa in the middle holds a tall totem tower. Long, thin bridges of wood and rope link the central mesa with the three smaller ones in the north-west, north-east and south. Lifts with windmills climb the cliffs of the central mesa from the plain."

