# The paintings of Navigation's instance maps: the dungeons and raids (Doc/guides/map-style.md; Doc/ideas/
# Navigation.md, *Instance maps as the world map, apart from it*; Doc/guides/image-generation.md, *Maps*).
#
# The instance maps are apart from the world map (their own view, data, pictures and jobs), but their three levels
# are made as the world map's are: the same pipeline, words, ComfyUI tools and terrain cleanups, so the two are one
# look and one precision (Saneroki, 2026-10-21). Text, pins, the bosses' 3D models and every other mark are drawn
# over them by code, never painted.
#   close    each floor's own terrain and indoor maps, pixel-exact: repainted by the Atlas' code with the Atlas'
#            words (atlas.toml), its softening, its check against the game's water and lava and its colour pass, at
#            the Atlas' pixels a yard, cut to the game's outline; from this file it takes a brief's colours and the
#            light of its atmosphere (its first sentence), as a zone's.
#   middle   each floor drawn anew in pencil on paper, exactly along that terrain's walls and walkable ground
#            (levels.toml's [middle]), seen straight from above in the floor's own frame (view below; the world's
#            middle level is seen at an angle, Saneroki, 2026-10-21), the ground the close level lies over.
#   far      one free, realistic reimagination of each instance as a whole, seen at an angle (levels.toml's [far]).
# The close and middle levels wait for the instances' terrain, which the world's tools (dev/tools/terrain-art,
# indoor-art) do not make yet; their jobs join the queue with it. The far level is painted now
# (dev/tools/dungeon-paint, the GPU runner's job "dungeons"): its image 1 is the instance's layout, every floor's
# map side by side in the game's order, blurred until only the shapes of its halls, rooms, corridors and water are
# left (no line, no drawing style, no writing can be read in it). Its words: far below, the shared [far] look, open,
# the brief's mood, the levels sentence where it has several floors, the brief's places, colours and atmosphere,
# and the shared [far] last sentence.
#
# One table per instance, keyed by its map ID (the game's Map table; the set Dungeons' key). name and kind are for
# people reading the file and never go into a prompt. The other fields are the zone briefs' (zones.toml), meant
# alike, and are prompt words that name nothing: a proper name in the words comes back as garbled letters in the
# picture, so places, peoples and creatures are described, never named. Kinds of people are common nouns in lower
# case (orcs, trolls, dwarves).
#   mood        what the place is and how it feels                                          8 to 40 words
#   places      how its parts lie and join, as a zone's major places                        12 to 60
#   colours     its colours                                                                  4 to 15
#   atmosphere  its light first, a sentence the Atlas' close level takes whole (no words of colour, haze, mist,
#               smoke, fog, cloud, dust, glow, cast: its filter drops such clauses), then its air and state  15 to 55

[words]
far = "Image 1 is a rough, blurred plan of one place seen from straight above. Use image 1 only for the layout: where its halls, rooms, corridors, stairs, courtyards, water and open ground lie, how large they are and how they join."
open = "Roofs, ceilings and the rock above are cut away, so every hall and room lies open to view."
view = "Seen straight from above like an orthographic satellite image, in image 1's frame: no perspective, no tilt, no horizon."
levels = "Image 1 shows the place's {n} levels side by side in order from the top left; they are one place, its levels joined as follows."

# Dungeons and raids with the game's own map art (the set Dungeons)

["33"]
name = "Shadowfang Keep"
kind = "dungeon"
mood = "A haunted castle of grey stone on a forested hill, cursed and overrun by werewolves and the ghosts of its nobles."
places = "One castle rising level by level: a walled courtyard inside the gate, a great dining hall and kennels around it, two round observatory towers climbing above, the lord's chamber near the top, and a long wall walk along the battlements joining them."
colours = "cold blue-grey stone, dark slate roofs, black pine green, ghostly violet"
atmosphere = "Cold blue moonlight from a full moon, deep black shadows, a few warm torches in the windows. Wet stone, wind in the pines, mist drifting through the courtyard."

["34"]
name = "Stormwind Stockade"
kind = "dungeon"
mood = "A prison under a great human capital, its dank cell blocks taken over by rioting prisoners."
places = "One level: long vaulted corridors lined with barred cells, meeting in a central guard hall, with a few larger rooms at their ends."
colours = "grey granite, rusted iron, dirty straw yellow, torch orange"
atmosphere = "Dim, flickering torchlight in low vaults, deep shadows between the cells. Smoke from small fires the prisoners lit, water dripping from the vaults, damp air."

["36"]
name = "Deadmines"
kind = "dungeon"
mood = "A gang of pirates' hideout in an old gold mine under coastal hills, its tunnels leading down to a hidden sea cave where a great warship is being built."
places = "Winding mine tunnels, timbered shafts and a smoky foundry descend through the rock and open into a huge sea cave with a dock, the warship at anchor in its water."
colours = "brown earth and timber, lantern gold, rusted iron, dark green sea water, red sails"
atmosphere = "Warm lantern light in the tunnels, cool grey daylight falling into the sea cave. Sparks and smoke from the forges, rock dust in the air, quiet water under the ship."

["43"]
name = "Wailing Caverns"
kind = "dungeon"
mood = "A vast cave system under a dry savanna, overgrown with giant ferns and roots, its pools and streams fouled, where druids sleep in a nightmare."
places = "One level of winding caverns and tunnels branching around a deep central chasm, with pools, little waterfalls and a raised mound at its heart."
colours = "moss green, earthy brown, murky teal water, pale glowing green"
atmosphere = "Dim, humid green light from fungus on the walls, pale daylight through cracks in the roof. Mist rising off still pools, the roots of the savanna hanging from the cave roof, the air heavy and damp."

["47"]
name = "Razorfen Kraul"
kind = "dungeon"
mood = "A warren of giant thorny brambles in a dry savanna, home of a boar people and their shamans."
places = "One level: paths walled and roofed by huge twisted thorn vines wind through the dry earth in loops and spirals, opening into small clearings and a sunken pit at the heart."
colours = "dusty ochre earth, dark red-brown thorns, bone white, dry yellow grass"
atmosphere = "Hard, hot sunlight broken into stripes by the thorny roof, sharp shadows. Dust in the air, campfires and bone totems smoking in the clearings."

["48"]
name = "Blackfathom Deeps"
kind = "dungeon"
mood = "A sunken temple of an ancient elven people on a dark sea shore, half drowned and taken over by a cult of the deep."
places = "Three levels as one ruin: a flooded hall of pools at the entrance, a moonlit shrine of broken pillars in the middle, and deep water caverns sinking below to a drowned altar."
colours = "deep teal water, pale moonstone grey, violet glints, dark algae green"
atmosphere = "Cold blue-green light rippling over the walls from the water, pale moonlight over the shrine. A drowned silence, wet stone, dark water lapping at broken pillars."

["70"]
name = "Uldaman"
kind = "dungeon"
mood = "An excavated vault of an ancient race of giant makers deep under red badlands, with dwarven dig works and old stone guardians."
places = "Rough dig tunnels with scaffolding and mine carts lead down into vast symmetrical halls of carved stone, rows of guardian statues, and a deep chamber with a great altar at the end."
colours = "rust red rock, sandstone, bronze, pale turquoise rune light"
atmosphere = "Warm lamplight in the dig tunnels, cool blue rune light in the great halls. Dry and dusty, the still air of a vault closed for ages."

["90"]
name = "Gnomeregan"
kind = "dungeon"
mood = "A once great city of gnomish machines inside a snowy mountain, flooded with glowing waste and overrun by its own robots."
places = "Four levels as one city: a giant hall of turning gears, sleeping quarters along long ramps, a rocket launch bay, and the inventors' court at the bottom, joined by ramps, lifts and pipes."
colours = "steel grey, copper and brass, toxic green, warning yellow"
atmosphere = "Flickering electric light and sparks, harsh and cold, dark corners between the machines. Green waste on the floors, steam venting from broken pipes, oil and rust everywhere."

["109"]
name = "Sunken Temple"
kind = "dungeon"
mood = "A great stepped jungle temple sunk into a swamp lake, home of green dragons and of trolls who worship a blood god."
places = "One sunken stepped pyramid: rings of galleries and stairs descend around a deep central pit, its upper tiers flooded, a sanctum at the bottom."
colours = "mossy green stone, murky swamp water, old gold, blood red"
atmosphere = "Soft green light filtering down through the water above, warm firelight from braziers on the tiers. Hot and humid, vines dripping, the air thick with mist over the flooded steps."

["129"]
name = "Razorfen Downs"
