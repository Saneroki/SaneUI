# The dungeons' and raids' paintings for Navigation's instance maps (Doc/ideas/Navigation.md, *Dungeon, instance and
# raid maps in three zooms*; Doc/guides/image-generation.md, *Maps*).
#
# The far zoom (dev/tools/dungeon-paint, the GPU runner's job "dungeons"): one free, realistic painting of each
# instance as a whole. Image 1 is its layout: every floor's map of the instance, side by side in the game's order,
# blurred until only the shapes of its halls, rooms, corridors and water are left (no line, no drawing style, no
# writing can be read in it). The words are the edit below, its brief's setting, the levels sentence where it has
# several floors, the brief's layout, colours and atmosphere, and the last sentence. The painting need not be
# exact: it is the instance's mood, its rooms and how they lie, seen from above at a steep angle.
#
# The close zoom (to come): the instance's own indoor maps (the game's indoor minimap textures of its buildings and
# caves, as dev/tools/indoor-art makes the continents' buildings', and its terrain where it has open ground)
# repainted with the Atlas' words (atlas.toml), exact and clear around like every indoor map. Its inputs are not
# made yet; its job joins the queue with them. The middle zoom is drawn by code (no painting).
#
# One table per instance, keyed by its map ID (the game's Map table; the set Dungeons' key). name and kind are for
# people reading the file and never go into a prompt. The other fields are prompt words and name nothing: a proper
# name in the words comes back as garbled letters in the picture, so places, peoples and creatures are described,
# never named. Kinds of people are common nouns in lower case (orcs, trolls, dwarves). Limits in words: setting 15
# to 40, layout 20 to 60, colours 6 to 15, atmosphere 15 to 40.

[words]
edit = "Image 1 is a rough, blurred plan of one place seen from straight above. Use image 1 only for the layout: where its halls, rooms, corridors, stairs, courtyards, water and open ground lie, how large they are and how they join. Paint a new picture of that place: a realistic fantasy render like cinematic concept art, the whole place in one view, seen from high above at a steep angle like a detailed model on a table. Roofs, ceilings and the rock above are cut away, so every hall and room lies open to view."
levels = "Image 1 shows the place's {n} levels side by side in order from the top left; they are one place, its levels joined as follows."
last = "This is not a map and not a drawing: no parchment, no paper, no outlines, no ink lines, no frame, no border, no legend, no labels, no text, no letters, no numbers, no symbols, no icons, no compass. Nothing of image 1's colours or drawing style is kept."

# Dungeons and raids with the game's own map art (the set Dungeons)

["33"]
name = "Shadowfang Keep"
kind = "dungeon"
setting = "A haunted castle of grey stone on a forested hill, cursed and overrun by werewolves and the ghosts of its nobles."
layout = "One castle rising level by level: a walled courtyard inside the gate, a great dining hall and kennels around it, two round observatory towers climbing above, the lord's chamber near the top, and a long wall walk along the battlements joining them."
colours = "cold blue-grey stone, dark slate roofs, black pine green, ghostly violet"
atmosphere = "Night under a full moon behind thin clouds; cold blue moonlight on wet stone, warm torchlight in a few windows, mist drifting through the courtyard."

["34"]
name = "Stormwind Stockade"
kind = "dungeon"
setting = "A prison under a great human capital, its dank cell blocks taken over by rioting prisoners."
layout = "One level: long vaulted corridors lined with barred cells, meeting in a central guard hall, with a few larger rooms at their ends."
colours = "grey granite, rusted iron, dirty straw yellow, torch orange"
atmosphere = "Dim and damp; torchlight flickering on wet stone, smoke from small fires the prisoners lit, water dripping from the vaults."

["36"]
name = "Deadmines"
kind = "dungeon"
setting = "A gang of pirates' hideout in an old gold mine under coastal hills, its tunnels leading down to a hidden sea cave where a great warship is being built."
layout = "Winding mine tunnels, timbered shafts and a smoky foundry descend through the rock and open into a huge sea cave with a dock, the warship at anchor in its water."
colours = "brown earth and timber, lantern gold, rusted iron, dark green sea water, red sails"
atmosphere = "Dusty lantern light in the tunnels, sparks and smoke from the forges, then the cool cavern with grey daylight falling through a gap in the rock onto the water."

["43"]
