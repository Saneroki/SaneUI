# The words of the instance maps' middle and far levels, the dungeons and raids, one look and one precision for
# all (Saneroki, 2026-10-21; Doc/guides/map-style.md). The close level's words are close.toml's.
# dev/tools/map-layers puts each painting's words together.
#
# Strict (Saneroki, 2026-10-21: "much more strict"; not free concept art, actual maps of the layout). As the close
# level's lab round found, words of an edit ("make image 1 look like ..., change only how it looks, never where or
# what anything is") keep a layout, words of a new picture do not; and each painting starts from image 1 itself
# (image to image, workflow qwen21-edit-3ref-i2i), its strength rising a step a try. A first pilot that asked for "a
# new map" with the brief's words drew the mine's floor with the ship of the cove beside it: the middle level takes
# no brief at all.

# The middle level: the game's own map of the place, drawn again by hand in pencil and brown ink on parchment in
# the colours of the game's own maps (Saneroki, 2026-10-22: "the yellow / orange that the blizzard maps are,
# instead of the white background", then each place in its own colours, greenish, yellowish, reddish, whitish, by
# what it is), straight from above, exactly over the terrain. Image 1 the game's map art in the frame, image 2 the
# terrain plan of the same frame, image 3 the parchment: the house paper's grain in the main colour of the game's
# map of that place (map-layers' parchment and tone_of).
# Words: images, look, last. Where the game has no map of the place, image 1 is the terrain plan and image 2
# another place's map for its manner (images_plan, look_plan).
[middle]
images = "Image 1 is the game's own map of this place. Image 2 is the exact ground plan of the same place, in the same frame. Image 3 is a piece of the paper to draw on."
look = "Make image 1 look like a map drawn by hand in pencil and brown ink on the parchment of image 3, washed in image 1's own colours as the game's maps are: every land keeps its tint of green, yellow, orange, red, brown or white where image 1 has it, seen straight from above. Change only how it is drawn, never where or what anything is: every outline, wall, cliff, shore, river, road, building, room and hall stays exactly where image 1 has it, with the same shape and size, as image 2 shows them. Clean pencil outlines, light hatching on rock, cliffs and ground nobody walks, the sea and lakes a faded grey-blue wash with fine pencil ripples, small careful pencil drawings of trees, houses and props where image 1 has them; the walkable ground plain parchment in its land's tint."
images_plan = "Image 1 is the exact ground plan of this place, seen from straight above. Image 2 is another place's map from the game: take only how it is drawn, nothing of its layout. Image 3 is a piece of the paper to draw on."
look_plan = "Make image 1 look like a map in the manner of image 2, drawn by hand in pencil and brown ink on the parchment of image 3, washed in its colours, seen straight from above. Change only how it is drawn, never where or what anything is: every outline, wall, room, hall and stair stays exactly where image 1 has it, with the same shape and size. Clean pencil outlines, light hatching on the rock around the halls, small careful pencil drawings of pillars, tombs and props where image 1 has them; the walkable floors are plain parchment, the ground around them parchment too."
last = "Remove every label, name, letter and number, every icon, skull and symbol, the frame, the border and the drawings around the map; where they were, plain parchment. Pencil and brown ink on tinted parchment only, the water a faded grey-blue wash."

# The far level: a photograph of the place taken straight down from high above (Saneroki, 2026-10-22: all three
# levels from straight above, so they lie over each other and every road, place and pin is in the same spot in
# each; the view from a plane at an angle given up), its layout kept with a little leeway, in its own mood, colours
# and light by its brief. Workflow qwen21-edit-2ref-i2i-cn: image 1 its plan, blurred and toned down (its textures
# gone); image 2 a piece of the close level; one control the layout: the plan's clearest edges. The words ask for
# dark water: the bright blue stood out.
# Learned on the continents' terrain (2026-10-22, at an angle): the sharp terrain as image 1 came back as the
# game's own terrain; without the controls the model painted a closer view; stronger and longer controls kept the
# game's look. Not the middle level's drawing either: it was copied.
# Words: images and look, open, "This place is <biome>.", the brief's buildings and places, its colours and light,
# last.
[far]
images = "Image 1 is this place seen straight down from high above, softly blurred: it shows where its halls, caves, rooms, walls, water and rock lie and their colours. Image 2 shows its ground up close."
look = "Make image 1 a sharp, highly detailed photograph taken straight down from high above this place: a realistic fantasy place in natural light, every hall, cave, room, wall, shore, water and rock exactly where image 1 has it, with its colours. Real stone, timber, earth, water and props in fine detail, as a real aerial photograph shows them; the materials of the ground as image 2 has them. Water is deep and dark: a dark blue, dark blue-green in the shallows, never bright or saturated, lit like the land around it."
open = "Over halls, caves and rooms under the ground or under a roof, the rock and the roofs are cut away so they lie open to view from above."
last = "Nothing added that the images do not show. No text, no labels, no map symbols, no frame, no border, no parchment."
