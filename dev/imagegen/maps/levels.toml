# The words of the maps' middle and far levels, shared by the world's zones and the instances (dungeons and raids),
# so the two are one look and one precision (Saneroki, 2026-10-21; Doc/guides/map-style.md). The close level is the
# Atlas' own words (atlas.toml), for both too. dev/tools/map-layers puts each painting's words together.
#
# Strict (Saneroki, 2026-10-21: "much more strict"; not free concept art, actual maps of the layout). As the Atlas'
# lab found, words of an edit ("make image 1 look like ..., change only how it looks, never where or what anything
# is") keep a layout, words of a new picture do not; and each painting starts from image 1 itself (image to image,
# workflow qwen21-edit-3ref-i2i), its strength rising a step a try. A first pilot that asked for "a new map" with the
# brief's words drew the mine's floor with the ship of the cove beside it: the middle level takes no brief at all.

# The middle level: the game's own map of the place, drawn again by hand in graphite pencil on the interface's
# parchment (Doc/guides/interface-style.md, *Paper*, *Pencil*), straight from above, exactly over the terrain.
# Image 1 the game's map art in the frame, image 2 the terrain plan of the same frame, image 3 the parchment.
# Words: images, look, last. Where the game has no map of the place, image 1 is the terrain plan and image 2
# another place's map for its manner (images_plan, look_plan).
[middle]
images = "Image 1 is the game's own map of this place. Image 2 is the exact ground plan of the same place, in the same frame. Image 3 is a piece of the paper to draw on."
look = "Make image 1 look like a map drawn by hand in graphite pencil on the cream parchment of image 3, seen straight from above. Change only how it is drawn, never where or what anything is: every outline, wall, cliff, shore, river, road, building, room and hall stays exactly where image 1 has it, with the same shape and size, as image 2 shows them. Clean pencil outlines, light hatching on rock, cliffs and ground nobody walks, fine pencil ripples on water, small careful pencil drawings of trees, houses and props where image 1 has them; the walkable ground is clean paper."
images_plan = "Image 1 is the exact ground plan of this place, seen from straight above. Image 2 is another place's map from the game: take only how it is drawn, nothing of its layout. Image 3 is a piece of the paper to draw on."
look_plan = "Make image 1 look like a map in the manner of image 2, drawn by hand in graphite pencil on the cream parchment of image 3, seen straight from above. Change only how it is drawn, never where or what anything is: every outline, wall, room, hall and stair stays exactly where image 1 has it, with the same shape and size. Clean pencil outlines, light hatching on the rock around the halls, small careful pencil drawings of pillars, tombs and props where image 1 has them; the walkable floors are clean paper, the ground around them plain paper."
last = "Remove every label, name, letter and number, every icon, skull and symbol, the frame, the border and the drawings around the map; where they were, plain paper. Graphite grey pencil on cream paper only."

# The far level: a photograph of the landscape from a plane high above, at an angle (Saneroki, 2026-10-21: "a
# perspective plane view on the landscape"), its layout kept roughly, with some leeway: coasts, lakes, rivers,
# mountains, cliffs and the ground nobody can cross, towns and landmarks where the terrain has them, so it fits the
# middle and close levels. Image 1 the terrain plan of the frame and around it, warped into that view
# (dev/tools/map-layers' plane_view), image 2 a piece of the close level's painting; painted from image 1 itself, a
# little under full strength. Not the middle level's drawing: given as a picture it was copied, symbols and all.
# A whole edit from nothing kept the look but not the frame (Westfall came out a closer view of its coast alone).
# Words: images, look, open (instances), "This place is <biome>.", the brief's buildings and places (zones also land,
# plants and roads), its colours and light, last.
[far]
images = "Image 1 is this place seen from a plane high above, at an angle: its terrain as the game draws it, the land ahead widening towards the top. Image 2 shows its ground up close."
look = "Make image 1 look like a photograph taken from a plane high above this place: a realistic fantasy landscape in natural light, seen at the same angle. Keep its layout: every coast, sea, lake, river, mountain, cliff, forest, road, town and landmark stays roughly where image 1 has it, at its size; a little leeway is fine, but nothing moves far, nothing new stands where image 1 has none, and mountains and cliffs stay where they bar the way. The darkest areas of image 1 beyond the coasts are the open sea. Take the look of the ground, its materials and colours from image 2."
open = "Over halls, caves and rooms under the ground or under a roof, the rock and the roofs are cut away so they lie open to view from above."
last = "Nothing added that the images do not show. No text, no labels, no map symbols, no frame, no border, no parchment."
