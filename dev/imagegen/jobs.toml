# The GPU runner's queue (dev/tools/gpu-runner; Doc/guides/image-generation.md, *The GPU runner*): ComfyUI work
# done while the graphics card is idle. The runner reads this file again at every look, so a job added here is
# taken up without a restart. The most important unfinished job runs: a higher priority, equal ones in this
# file's order, or the one switched to (saneui switch NAME) until it is finished; a more important one takes
# over from the one at work at once, which keeps its progress. saneui gpuqueue lists them in the order they run.
#
# A session that adds or changes a render plan (a set's lists, a map's plan, a job's words or workflow) adds or
# updates its job here in the same commit, with a priority: the Atlas' close squares are 10, above it what
# Saneroki waits for, below it what can wait; ask Saneroki when unclear. The maps' painted levels of the
# instances are low (2); the redesigns of interface parts (the map pins, the route line, the raid markers, ...) go
# above them when they are queued (Saneroki, 2026-10-21).
#
#   [[job]]
#   name = "atlas"                                   # letters, digits, - and _; its log is <name>.log
#   priority = 10
#   command = ["dev/tools/atlas", "paint"]           # run from Sane UI's folder; run again after each stop
#   status = ["dev/tools/atlas", "status"]           # optional: its first line shows in gpu-runner status
#   done = '^(\d+) of \1 squares painted'            # optional: finished when status's output matches this
#   comfyui = true                                   # false: the job needs no ComfyUI (the runner leaves it off)
#   rebuild = ["dev/tools/atlas", "rebuild"]         # optional: what gpu-runner rebuild runs to start it anew
#                                                    # with the plans as they are; without it, it goes on
#
# The runner's settings (these are the defaults):
#   hold = 180          seconds the card must stay free before a job starts again
#   poll = 3            seconds between looks
#   mem_limit = 1536    MiB another program may hold of the card
#   sm_limit = 40       percent of the card another program may use ...
#   busy_looks = 3      ... at so many looks in a row
#   games = ["Wow*.exe"]
#   ignore = ["kwin_wayland", "kwin_x11", "Xorg", "Xwayland", "plasmashell", "gnome-shell"]   the desktop
#   tries = 3           a job that fails so often in a row waits for gpu-runner reset <name>
#
# Long painting runs go in here only on Saneroki's word.

# The Atlas' close squares, both continents (Saneroki, 2026-10-21).
[[job]]
name = "atlas"
priority = 10
command = ["dev/tools/atlas", "paint"]
status = ["dev/tools/atlas", "status"]
done = '^(\d+) of \1 squares painted'
rebuild = ["dev/tools/atlas", "rebuild"]

# The Atlas' middle and far levels, every zone and city of both continents (Saneroki, 2026-10-22: render everything
# at all three levels so the Atlas works in the game; the close level is the job above): each zone's pencil map on
# its own parchment and its photograph straight down, in its own frame, to be joined along the zones' outlines
# (dev/tools/map-layers stitch). 49 zones, two to six paintings each.
[[job]]
name = "zonemaps"
priority = 10
command = ["dev/tools/map-layers", "paint", "--levels", "middle,far", "--kind", "zone"]
status = ["dev/tools/map-layers", "status"]

# The interface's whole render (Saneroki, 2026-10-21: the style locked in, clean high quality renders of every part
# the code needs, at 4K scale; 2026-10-22: the final pieces, one render each, and a full screen of the character,
# guild and chat windows made from them): the picks cleaned, the parts at 4K, the masks of the whole picks, the
# pencil pieces, the final pieces, the views, the 4K full screen and the gallery. Each step skips what it has made.
# Plan: dev/imagegen/sets/interface/catalog.py; Doc/guides/interface-style.md, *Running it*.
[[job]]
name = "interface"
priority = 20
command = ["python3", "dev/imagegen/sets/interface/catalog.py"]
status = ["python3", "dev/imagegen/sets/interface/catalog.py", "--status"]
done = '^complete'
rebuild = ["python3", "dev/imagegen/sets/interface/catalog.py", "--rebuild"]

# The maps' comparison (Saneroki, 2026-10-22: Duskwood and Ashenvale in all three levels, laid over the game's own
# maps): the two zones' close levels over their whole frames, 35 and 126 squares (dev/tools/map-layers, the samples'
# run in assets/generated/map-layers; each square skipped once painted).
[[job]]
name = "mapcompare"
priority = 2
command = ["dev/tools/map-layers", "paint", "--whole-close", "--only", "zone-1431,zone-1440"]
status = ["dev/tools/map-layers", "status"]
