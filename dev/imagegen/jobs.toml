# The GPU runner's queue (dev/tools/gpu-runner; Doc/guides/image-generation.md, *The GPU runner*): ComfyUI work
# done while the graphics card is idle. The runner reads this file again at every look, so a job added here is
# taken up without a restart. The most important unfinished job runs: a higher priority, equal ones in this
# file's order, or the one switched to (saneui switch NAME) until it is finished; a more important one takes
# over from the one at work at once, which keeps its progress. saneui gpuqueue lists them in the order they run.
#
# A session that adds or changes a render plan (a set's lists, a map's plan, a job's words or workflow) adds or
# updates its job here in the same commit, with a priority: 10 for what Saneroki waits for, lower for what can
# wait; ask Saneroki when unclear. The maps' painted levels of the instances are low (2); the redesigns of
# interface parts (the map pins, the route line, the raid markers, ...) go above them when they are queued
# (Saneroki, 2026-10-21).
#
#   [[job]]
#   name = "instancemaps"                            # letters, digits, - and _; its log is <name>.log
#   priority = 2
#   command = ["dev/tools/map-layers", "paint"]      # run from SaneUI's folder; run again after each stop
#   status = ["dev/tools/map-layers", "status"]      # optional: its first line shows in gpu-runner status
#   done = '^(\d+) of \1 paintings made'             # optional: finished when status's output matches this
#   comfyui = true                                   # false: the job needs no ComfyUI (the runner leaves it off)
#   rebuild = ["...", "..."]                         # optional: what gpu-runner rebuild runs to start it anew
#                                                    # with the plans as they are; without it, it goes on
#
# The runner's settings (these are the defaults):
#   hold = 180          seconds the card must stay free before a job starts again
#   poll = 3            seconds between looks
#   mem_limit = 1536    MiB another program may hold of the card
#   sm_limit = 40       percent of the card another program may use ...
#   busy_looks = 3      ... at so many looks in a row
#   games = ["Wow*.exe"]
#   ignore = ["kwin_wayland", "kwin_x11", "Xorg", "Xwayland", "plasmashell", "gnome-shell"]   the desktop
#   tries = 3           a job that fails so often in a row waits for gpu-runner reset <name>
#
# Long painting runs go in here only on Saneroki's word.

# The instance maps (Saneroki, 2026-10-22: every dungeon's and raid's map, a view of its own beside the world map):
# one large far render each, a photograph straight down of the whole instance, its halls cut open
# (dev/tools/map-layers, its instances: 30, their terrain extracted from the install by build). Each skipped once
# painted.
[[job]]
name = "instancemaps"
priority = 2
command = ["dev/tools/map-layers", "paint", "--levels", "far"]
status = ["dev/tools/map-layers", "status", "--levels", "far"]
done = '^(\d+) of \1 paintings made'

# The painted sea, round 3 (Saneroki, 2026-11-11: from round 2's maelstrom-1, "The whirlwind is to big [...] It should
# be more like a siphon instead of a black hole", and "try out other models and higher resolutions [...] more room to
# add fantastical beasts and ship/monster battles"): the old whirlpool cleared, the picture made 4096 x 2208, then the
# siphon maelstrom and six scenes painted each in a crop of its own with four models (dev/imagegen/sets/sea/scenes.toml),
# the page /sea/ (saneui showsea). 30 paintings, about a quarter of an hour; goes on where it stopped.
[[job]]
name = "sea-round3"
priority = 10
command = ["dev/tools/sea-art", "round", "dev/imagegen/sets/sea/scenes.toml", "assets/generated/sea/round-3",
           "assets/generated/sea/round-2/maelstrom-1.png",
           "qwen21-inpaint,flux2dev-turbo-inpaint,zimage-turbo-inpaint,klein4b-inpaint"]
status = ["dev/tools/sea-art", "status", "dev/imagegen/sets/sea/scenes.toml", "assets/generated/sea/round-3",
          "qwen21-inpaint,flux2dev-turbo-inpaint,zimage-turbo-inpaint,klein4b-inpaint"]
done = '^(\d+) of \1 paintings made'
# The Maelstrom's whirlpool repainted as foam at 2048 (Saneroki, 2026-11-15: "can we have a ai upscale it and maybe add
# some details [...] a good alpha to blend in nicely with the water"): three ways, three seeds each, from the world map's
# spiral (dev/imagegen/sets/sea/whirlpool.txt). Round 2 rendered and picked ("b1": assets/Whirlpool/whirlpool-foam.png),
# so it stands finished; dev/tools/gpu-runner reset whirlpool renders it again.
[[job]]
name = "whirlpool"
priority = 10
command = ["dev/tools/imagegen", "dev/imagegen/sets/sea/whirlpool.txt"]
status = ["sh", "-c", "echo \"$(ls assets/generated/whirlpool/round-2/foam-alpha-?.png assets/generated/whirlpool/round-2/foam-black-?.png assets/generated/whirlpool/round-2/strokes-?.png 2>/dev/null | wc -l) of 9 pictures made\""]
done = '^9 of 9 pictures made'
